name: Refresh star history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-star-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record real star count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/update_star_history.py --repo "$GH_REPO"
      - name: Save chart when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/star-history.json docs/assets/star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh repository star snapshot'
            git push
          fi
